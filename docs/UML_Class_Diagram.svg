<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" text-anchor="middle" font-size="28" font-weight="bold">UML Class Diagram — Book Reading Challenge Tracker</text><rect x="60" y="150" width="450" height="360" rx="14" fill="#eef4f8" stroke="#263746" stroke-width="2"/><text x="285" y="190" text-anchor="middle" font-size="24" font-weight="bold">Application</text><text x="85" y="245" font-size="18">- entries[100]: ReadingEntry</text><text x="85" y="280" font-size="18">- count: int</text><text x="85" y="340" font-size="18">+ addReadingEntry()</text><text x="85" y="375" font-size="18">+ viewAllEntries()</text><text x="85" y="410" font-size="18">+ searchEntry()</text><text x="85" y="445" font-size="18">+ showSummary()</text><rect x="650" y="110" width="480" height="460" rx="14" fill="#eef4f8" stroke="#263746" stroke-width="2"/><text x="890" y="150" text-anchor="middle" font-size="24" font-weight="bold">ReadingEntry</text><text x="680" y="205" font-size="17">- entryId: string</text><text x="680" y="235" font-size="17">- readerName: string</text><text x="680" y="265" font-size="17">- bookTitle: string</text><text x="680" y="295" font-size="17">- authorName: string</text><text x="680" y="325" font-size="17">- challengeName: string</text><text x="680" y="355" font-size="17">- pagesRead: int</text><text x="680" y="385" font-size="17">- totalPages: int</text><text x="680" y="415" font-size="17">- totalEntries: static int</text><text x="680" y="465" font-size="17">+ setDetails(...), getters</text><text x="680" y="495" font-size="17">+ getProgressPercent(), getStatus()</text><text x="680" y="525" font-size="17">+ displayEntry() : friend</text><path d="M510 330 L650 330" stroke="#526575" stroke-width="3"/><path d="M635 320 L650 330 L635 340" fill="none" stroke="#526575" stroke-width="3"/></svg>